<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1d1d1d, #050505 65%);
        color: #f43f5e;
        font-family: "Creepster", system-ui, sans-serif;
        text-align: center;
        gap: 2rem;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2.5rem, 6vw, 5rem);
        letter-spacing: 0.2em;
        text-shadow: 0 0 15px rgba(244, 63, 94, 0.7),
          0 0 30px rgba(244, 63, 94, 0.4);
        animation: flicker 2.5s infinite;
      }

      .gif-wrapper {
        max-width: min(90vw, 420px);
        width: 100%;
        border: 4px solid rgba(244, 63, 94, 0.6);
        border-radius: 1.5rem;
        box-shadow: 0 0 40px rgba(244, 63, 94, 0.35);
        overflow: hidden;
        backdrop-filter: blur(4px);
      }

      img {
        width: 100%;
        height: auto;
        display: block;
      }

      @keyframes flicker {
        0%,
        18%,
        22%,
        25%,
        53%,
        57%,
        100% {
          opacity: 1;
        }

        20%,
        24%,
        55% {
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <div class="gif-wrapper">
      <img
        src="./20251031_1643_New Video_simple_compose_01k8y05cs8f0nbjmh290enjmyp.gif"
        alt="Haunted pay-in loop"
      />
    </div>
    <h1>You Have Been Infected!</h1>
  </body>
</html>
